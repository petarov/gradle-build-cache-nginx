services:
  gbc:
    build: .
    image: gradle-build-cache-nginx:1.0.0
    container_name: gbc
    restart: unless-stopped
    environment:
      # All optional; documented in .env.example.
      GBC_HTTP_GET_USER:     "${GBC_HTTP_GET_USER:-}"
      GBC_HTTP_GET_PASSWORD: "${GBC_HTTP_GET_PASSWORD:-}"
      GBC_HTTP_PUT_USER:     "${GBC_HTTP_PUT_USER:-}"
      GBC_HTTP_PUT_PASSWORD: "${GBC_HTTP_PUT_PASSWORD:-}"
      GBC_MAX_ENTRY_SIZE:    "${GBC_MAX_ENTRY_SIZE:-512m}"
    ports:
      - "${GBC_BIND:-127.0.0.1}:${GBC_HTTP_PORT:-80}:80"
    volumes:
      # One mount for both the entry store (cache/) and the PUT temp dir (tmp/).
      # Note that nginx renames temp -> final, which is atomic only inside a
      # single filesystem.
      - ${GBC_DATA_DIR:-/var/lib/gradle-build-cache-nginx}/store:/data
      # Logs on the host should be handled by logrotate; see systemd/gbc-logrotate.conf
      - ${GBC_DATA_DIR:-/var/lib/gradle-build-cache-nginx}/logs:/var/log/nginx
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
