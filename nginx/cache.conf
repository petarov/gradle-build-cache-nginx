# /etc/nginx/cache.conf -- raw Gradle HTTP build cache
#
# Cache endpoint.
#   GET/PUT /cache/<32 lowercase hex>   ->   /data/cache/<first 2 hex>/<32 hex>
# /etc/nginx/cache.conf -- included by site.conf.
#
# The 256-way shard is not about lookup speed -- ext4 dir_index handles a
# million-entry directory fine. It is about (1) the exclusive lock ext4 takes on
# a directory inode for every create/rename, which every PUT ends in, and which
# serializes concurrent pushes from a CI fleet, and (2) the ~10M entry ceiling of
# a 2-level htree, which a busy cache reaches. Shards are pre-created at start.

# Prefix match, deliberately NOT ^~, so the regex location below is still
# evaluated. This catches every URI under /cache/ that is not exactly one
# well-formed key: wrong length, uppercase, sub-paths, traversal attempts,
# trailing slash. 404 -- never 403 or 405 -- because any status outside
# {200,201,204,404} disables the remote cache for the rest of that Gradle build.
location /cache/ {
    return 404;
}

# Strict key validation happens in the location regex itself, so a malformed key
# never reaches the filesystem layer at all.
location ~ "^/cache/(?<gbc_shard>[0-9a-f]{2})(?<gbc_rest>[0-9a-f]{30})$" {
    # The only part of this file that cannot be static, because nginx has no
    # conditionals: client_max_body_size, the auth_basic directives for reads,
    # and the limit_except block guarding writes. Written at container start by
    # 41-gbc-config.sh from the GBC_* environment. `nginx -T` shows the result.
    include /etc/nginx/gen/cache.conf;

    # alias, not `rewrite ... break`. VERIFIED BEHAVIOUR: limit_except installs a
    # nested location whose config is selected in the FIND_CONFIG phase, i.e.
    # before the REWRITE phase, and the outer location's rewrite rules are not
    # applied to the limited methods. A rewrite here is honoured for GET and
    # silently ignored for PUT, so entries land outside the shard and every
    # subsequent GET is a miss. root/alias are inherited by the nested location,
    # so alias is correct for both verbs.
    alias /data/cache/$gbc_shard/$gbc_shard$gbc_rest;

    # A miss is the normal case for a build cache -- every key is a miss before
    # it is a hit -- but nginx logs every failed open() at error level. Without
    # this the error log is ~all ENOENT noise. The 404 is unaffected and still
    # recorded in access.log; genuine problems (EACCES, EIO) still log.
    log_not_found off;

    dav_methods PUT;               # GET is not a DAV method; DELETE stays off
    create_full_put_path on;       # shards are pre-created; this is the safety net
    dav_access user:rw group:r all:r;   # 0644 so stats/backup scripts can read

    # MUST be the same filesystem as /data/cache. nginx writes the body to a temp
    # file and rename(2)s it into place; rename is atomic only within one
    # filesystem. Cross-device degrades to a copy: slow, and it briefly exposes a
    # partial file to a concurrent GET. 40-gbc-preflight.sh asserts st_dev equality.
    client_body_temp_path /data/tmp;
}
