# Baked into the image at /etc/nginx/gbc/10-site.conf
#
# Notes for that front proxy:
#   client_max_body_size  must be at least as large as GBC_MAX_ENTRY_SIZE there
#                         too, or IT returns 413 and the build stops caching.
#   proxy_request_buffering off;   otherwise every PUT is written to disk twice.
#   proxy_read_timeout 300s;       match the timeouts in nginx.conf.
#   Do not add a http->https redirect in front of this: Gradle replays a PUT
#   only on 307/308, so a 301/302 silently turns every push into a no-op GET.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    include /etc/nginx/gbc-inc/cache.conf;

    location / {
        return 404;
    }
}
