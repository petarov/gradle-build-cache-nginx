# /etc/nginx/nginx.conf -- raw Gradle HTTP build cache
#
# HARD DESIGN RULE
#   Inside the cache location, the only statuses a Gradle client may ever see are
#   200, 201, 204, 404 (plus 401 when basic auth is enabled). Every other status
#   makes Gradle log one warning and disable the remote cache for the REST of that
#   build. Directives that can emit anything else are therefore deliberately
#   absent here and must not be added:
#     limit_req / limit_conn  -> 503
#     error_page              -> 500 when the error page file is missing
#     deny / allow            -> 403

user  nginx;
worker_processes auto;
pid /var/run/nginx.pid;

error_log /var/log/nginx/error.log warn;

events {
    worker_connections  4096;
    multi_accept        on;
}

http {
    # Every entry is Gradle's opaque tar+metadata blob. No sniffing, no rewriting.
    types { }
    default_type  application/octet-stream;

    log_format gbc '$time_iso8601 $remote_addr "$remote_user" $request_method '
                   '$request_uri $status req=$request_length resp=$body_bytes_sent '
                   'rt=$request_time';
    access_log /var/log/nginx/access.log gbc buffer=64k flush=5s;

    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;

    # Hands blocking disk reads to a thread pool so one worker is not stalled
    # serving a cold entry while other clients wait. Pointless at a handful of
    # concurrent clients -- there is no queue to hold up. Enable it if the number
    # of build agents hitting this cache grows enough that pushes and pulls start
    # overlapping in bulk.
    #aio           threads;

    gzip off;              # entries are opaque bytes -- never recompress
    etag  off;             # Gradle never sends conditional requests
    server_tokens off;
    absolute_redirect off;

    # A 40-agent CI burst opens many short-lived requests per build.
    keepalive_timeout  300s;
    keepalive_requests 100000;

    # Generous timeouts: a laptop pushing a 300 MB entry over VPN must not get 408.
    client_header_timeout 60s;
    client_body_timeout   300s;
    send_timeout          300s;
    reset_timedout_connection on;

    include /etc/nginx/site.conf;
}
