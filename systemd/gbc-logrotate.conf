# /etc/logrotate.d/gradle-build-cache
# Logs are bind-mounted from the container, so rotation happens on the host and
# nginx must be told to reopen its files. USR1 = reopen logs (not a reload).
/srv/gradle-build-cache/logs/*.log {
    daily
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    # 101 is the nginx uid inside the container.
    create 0640 101 101
    sharedscripts
    postrotate
        /usr/bin/docker kill -s USR1 gbc >/dev/null 2>&1 || true
    endscript
}
